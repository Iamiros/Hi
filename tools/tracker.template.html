<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترکر برش ۸ هفته‌ای</title>
<meta name="description" content="ترکر تعاملی ۸ هفته: حفظ عضله، قدرت کل بدن، لاغری و رسیدن به ۸-۱۰ Pull-up">
<meta name="theme-color" content="#07090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cut 8W">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
__FONTS__
/* Layout: night training console. Dark-first, glass instrument panels over an aurora field.
   One column on phones, session | day split from 980px. Radius: panels 22px, controls 14px, chips round. */
:root{
  --bg:#EDF0F5; --bg-glow1:rgba(79,124,255,.18); --bg-glow2:rgba(124,196,255,.16);
  --panel:rgba(255,255,255,.72); --panel-solid:#F8FAFC; --surface2:#E4E9F0; --line:rgba(15,25,45,.09); --hl:rgba(255,255,255,.9);
  --ink:#0C1320; --ink2:#46526A; --ink3:#5A6578;
  --accent:#2E66E8; --accent2:#3FA5F5; --accent-ink:#1F50C2; --on-accent:#FFFFFF; --accent-soft:rgba(46,102,232,.12);
  --gold:#A9760F; --gold-soft:rgba(201,148,30,.16); --ok:#148556; --warn:#A35C0B; --bad:#BE3A33;
  --h0:#E2E7EE; --h1:#C6D6F3; --h2:#94B3EC; --h3:#3C70E0; --h4:#1F4AA1; --t-lo:#0C1320; --t-hi:#FFFFFF;
  --shadow:0 1px 1px rgba(15,30,60,.04),0 10px 30px rgba(15,30,60,.08);
  --r-lg:22px; --r-md:14px;
  --f-fa:'Vazirmatn','Tahoma','Segoe UI',system-ui,sans-serif;
  --f-x:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07090D; --bg-glow1:rgba(64,110,255,.30); --bg-glow2:rgba(80,190,255,.16);
    --panel:rgba(18,23,32,.72); --panel-solid:#11161E; --surface2:#1A212C; --line:rgba(255,255,255,.07); --hl:rgba(255,255,255,.06);
    --ink:#F2F5F9; --ink2:#A3AFC0; --ink3:#8793A5;
    --accent:#5B94FF; --accent2:#7CD0FF; --accent-ink:#93B8FF; --on-accent:#06101F; --accent-soft:rgba(91,148,255,.14);
    --gold:#F1BC55; --gold-soft:rgba(241,188,85,.14); --ok:#45D39C; --warn:#F5AA60; --bad:#FF7E76;
    --h0:#161C26; --h1:#1E2F4B; --h2:#2B4C86; --h3:#5B94FF; --h4:#A9C8FF; --t-lo:#F2F5F9; --t-hi:#06101F;
    --shadow:0 1px 1px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07090D; --bg-glow1:rgba(64,110,255,.30); --bg-glow2:rgba(80,190,255,.16);
  --panel:rgba(18,23,32,.72); --panel-solid:#11161E; --surface2:#1A212C; --line:rgba(255,255,255,.07); --hl:rgba(255,255,255,.06);
  --ink:#F2F5F9; --ink2:#A3AFC0; --ink3:#8793A5;
  --accent:#5B94FF; --accent2:#7CD0FF; --accent-ink:#93B8FF; --on-accent:#06101F; --accent-soft:rgba(91,148,255,.14);
  --gold:#F1BC55; --gold-soft:rgba(241,188,85,.14); --ok:#45D39C; --warn:#F5AA60; --bad:#FF7E76;
  --h0:#161C26; --h1:#1E2F4B; --h2:#2B4C86; --h3:#5B94FF; --h4:#A9C8FF; --t-lo:#F2F5F9; --t-hi:#06101F;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-fa);font-size:16px;line-height:1.65;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(104px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.has-timer{padding-bottom:calc(176px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;pointer-events:none;z-index:-1;
  background:radial-gradient(40% 50% at 78% 18%,var(--bg-glow1),transparent 70%),radial-gradient(35% 45% at 18% 8%,var(--bg-glow2),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.en{font-family:var(--f-x);direction:ltr;unicode-bidi:isolate;font-weight:600;letter-spacing:-.005em}
.x{font-family:var(--f-x);font-stretch:118%;font-weight:800;letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:var(--r-md);z-index:30}
.skip:focus{top:12px}
.app{max-width:1160px;margin:0 auto;padding:0 16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 6px 18px var(--accent-soft)}
.mark svg{width:22px;height:22px}
.brand h1{font-size:1.02rem;font-weight:700}
.brand .x{font-size:.72rem;color:var(--ink3);display:block;line-height:1;font-weight:700;letter-spacing:.08em}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 12px;border-radius:999px;background:var(--surface2);font-size:.8rem;font-weight:500;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}

/* panels */
.panel{position:relative;background:var(--panel-solid);background:var(--panel);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border-radius:var(--r-lg);box-shadow:var(--shadow),inset 0 0 0 1px var(--line),inset 0 1px 0 var(--hl);padding:18px}
.stack > * + *{margin-top:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h2{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.ph .r{display:flex;align-items:center;gap:6px}
.info{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink3);background:var(--surface2);font-family:var(--f-x);font-weight:800;font-size:.85rem;flex:none;position:relative;transition:background .2s ease,color .2s ease}
.info::after{content:"";position:absolute;inset:-6px}
.info:hover{color:var(--accent-ink);background:var(--accent-soft)}
.grid2{display:grid;gap:14px}
@media (min-width:980px){.grid2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.anim .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* week strip */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 14px}
.wd{min-height:76px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);transition:background .2s ease,transform .15s ease}
.wd:active{transform:scale(.95)}
.wd .dn{font-size:.72rem}
.wd .dd{font-family:var(--f-x);font-weight:800;font-size:1rem;color:var(--ink)}
.wd svg{width:24px;height:24px;transform:rotate(-90deg)}
.wd[aria-current="date"]{background:var(--panel-solid);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.wd.today .dd{color:var(--gold)}
.iconbtn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink2);transition:background .2s ease}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.3;cursor:default}

/* hero */
.hero{overflow:hidden;padding:20px}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.hero .glow{position:absolute;inset:auto auto -40% -20%;width:70%;height:120%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.ring{width:150px;height:150px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .ctr b{font-size:2.6rem;display:block}
.ring .ctr span{font-size:.72rem;color:var(--ink2);display:block;margin-top:4px}
.dayno{font-size:.8rem;color:var(--ink2)}
.dayno b{font-size:2.6rem;line-height:1;display:inline-block;color:var(--ink)}
.hero h2{font-size:1.15rem;font-weight:700;margin-top:4px}
.hero .sub{color:var(--ink2);font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kpis3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.kpis3 > div{background:var(--surface2);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.kpis3 b{display:block;font-size:1.25rem;line-height:1.1}
.kpis3 span{font-size:.72rem;color:var(--ink2)}
.strip{display:flex;gap:2px;margin-top:14px}
.strip i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.strip i.w{margin-inline-start:4px}
.strip i.cur{background:var(--gold);height:9px;margin-top:-2px;box-shadow:0 0 10px var(--gold-soft)}
@media (max-width:390px){.ring{width:122px;height:122px}.ring .ctr b{font-size:2.1rem}.dayno b{font-size:2.1rem}}

/* notices */
.notice{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--gold-soft);margin-top:10px;font-size:.9rem}
.notice::before{content:"";width:3px;border-radius:2px;background:var(--gold);flex:none}
.notice b{display:block;font-size:.95rem}
.notice.acc{background:var(--accent-soft)} .notice.acc::before{background:var(--accent)}
.notice.bad{background:color-mix(in srgb,var(--bad) 13%,transparent)} .notice.bad::before{background:var(--bad)}

/* session */
.sess-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sess-h .x{font-size:2.1rem;line-height:.95;display:block}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r-md);padding:3px}
.seg button{min-height:38px;min-width:62px;padding:0 14px;border-radius:11px;font-weight:600;color:var(--ink2);transition:background .2s ease,color .2s ease}
.seg button[aria-pressed="true"]{background:var(--panel-solid);color:var(--ink);box-shadow:var(--shadow)}
details.fold{border-top:1px solid var(--line);margin-top:12px}
details.fold > summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-3px) rotate(45deg);transition:transform .2s ease;margin-inline-end:6px;flex:none}
details.fold[open] > summary::after{transform:translateY(2px) rotate(-135deg)}
.wu{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.wu li{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ename{font-size:1.12rem;font-family:var(--f-x);font-weight:700;color:var(--ink);text-align:start;line-height:1.25;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.ename::after{content:"i";font-size:.7rem;width:18px;height:18px;border-radius:999px;display:inline-grid;place-items:center;background:var(--surface2);color:var(--ink3);font-weight:800;font-stretch:100%}
.ex.done .ename{color:var(--ink2)}
.dose{font-family:var(--f-x);font-stretch:112%;font-weight:800;font-size:1.2rem;color:var(--accent-ink);white-space:nowrap;direction:ltr}
.meta{font-size:.82rem;color:var(--ink2);margin-top:2px}
.meta bdi,.meta .en{white-space:nowrap}
.hint-line{font-size:.8rem;margin-top:8px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:inline-block}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.dot{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-x);font-weight:800;color:var(--ink3);background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
.dot:active{transform:scale(.88)}
.dot.on{background:linear-gradient(140deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:0 6px 16px var(--accent-soft)}
.linkbtn{min-height:44px;padding:0 12px;border-radius:var(--r-md);color:var(--accent-ink);font-weight:600;font-size:.86rem}
.linkbtn:hover{background:var(--accent-soft)}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:var(--r-md);background:var(--surface2);font-weight:600;transition:transform .15s ease,filter .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(140deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:0 8px 20px var(--accent-soft)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}

/* checklist */
.grp + .grp{margin-top:12px}
.grp h3{font-size:.74rem;font-weight:600;color:var(--ink3);margin-bottom:2px;letter-spacing:.02em}
.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 6px;text-align:start;border-radius:var(--r-md);transition:background .2s ease}
.chk:hover{background:var(--surface2)}
.chk .box{flex:none;width:26px;height:26px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--ink3);display:grid;place-items:center;transition:background .2s ease,box-shadow .2s ease}
.chk .box svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .25s cubic-bezier(.3,1.6,.5,1)}
.chk[aria-pressed="true"] .box{background:linear-gradient(140deg,var(--accent2),var(--accent));box-shadow:none}
.chk[aria-pressed="true"] .box svg{opacity:1;transform:none}
.chk[aria-pressed="true"] .lbl{color:var(--ink3)}
.chk .lbl{flex:1;min-width:0;font-size:.93rem}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px;flex-wrap:wrap}
.row .lbl{flex:1;min-width:150px;font-size:.93rem}
.pips{display:flex;gap:6px;flex:none}
.pip{width:36px;height:36px;border-radius:999px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--f-x);font-weight:800;font-size:.85rem;color:var(--ink3);position:relative;transition:background .2s ease}
.pip::after{content:"";position:absolute;inset:-4px}
.pip.on{background:linear-gradient(140deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:none}

/* scales (readiness) */
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale5 button{min-height:44px;border-radius:12px;background:var(--surface2);font-family:var(--f-x);font-weight:800;color:var(--ink2);transition:background .2s ease}
.scale5 button[aria-pressed="true"]{background:linear-gradient(140deg,var(--accent2),var(--accent));color:var(--on-accent)}
.fq + .fq{margin-top:12px}
.fq .lb{display:flex;justify-content:space-between;font-size:.84rem;color:var(--ink2);margin-bottom:6px}
.gauge{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.gauge svg{width:84px;height:84px;transform:rotate(-90deg);flex:none}
.gauge b{font-size:1.9rem;line-height:1}

/* water */
.water{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.tank{width:66px;height:104px;border-radius:16px 16px 20px 20px;position:relative;overflow:hidden;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line)}
.tank i{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(180deg,var(--accent2),var(--accent));transition:height .6s cubic-bezier(.2,.8,.2,1)}
.tank i::before{content:"";position:absolute;inset-inline:-10%;top:-6px;height:12px;border-radius:50%;background:var(--accent2);opacity:.6}
.big{font-size:2rem;line-height:1}
.wbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* fuel */
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.macro b{display:block;font-size:1.35rem;line-height:1.1;text-align:right}
.macro span{font-size:.74rem;color:var(--ink2)}
.ratio{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:12px}
.ratio i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.meter{margin-top:10px}
.meter .lb{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2);margin-bottom:4px}
.meter .tr{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.meter.over .tr i{background:var(--warn)}

/* fields */
.fld + .fld{margin-top:12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label.f{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.inp{width:100%;min-height:48px;padding:10px 14px;background:var(--surface2);border:1.5px solid transparent;border-radius:var(--r-md);transition:border-color .2s ease,background .2s ease}
.inp:focus{outline:none;border-color:var(--accent);background:var(--panel-solid)}
textarea.inp{min-height:88px;resize:vertical}
.hint{font-size:.78rem;color:var(--ink3);margin-top:6px}
.result{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft)}
.result b{font-size:1.4rem;display:block;line-height:1.1}
.result span{font-size:.74rem;color:var(--ink2)}

/* pages */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:var(--r-md);background:var(--surface2);font-weight:600;color:var(--ink)}
.back svg{width:20px;height:20px}
.pt-fa{font-size:1.6rem;font-weight:700;line-height:1.35;margin-top:4px}
.pt-en{font-size:1.5rem;line-height:1.05;color:var(--accent-ink);margin-top:4px;text-align:right}
.h2{font-size:1rem;font-weight:700}
.steps{margin:10px 0 0;padding-inline-start:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s,persian);width:30px;height:30px;border-radius:999px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.bad-list{margin:10px 0 0;padding-inline-start:0;list-style:none;display:grid;gap:10px}
.bad-list li{display:flex;gap:10px}
.bad-list li::before{content:"✕";flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-size:.75rem;font-weight:800}
.exlist{display:grid;gap:8px;margin-top:10px}
.excard{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:start;padding:12px;border-radius:var(--r-md);background:var(--surface2);transition:transform .15s ease}
.excard:active{transform:scale(.98)}
.exn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--panel-solid);font-size:.9rem}
.exm{min-width:0;display:flex;flex-direction:column}
.exm b{font-size:.92rem;font-weight:700}
.exm .en{font-size:.82rem;color:var(--ink2)}
.wolink{color:inherit;text-align:start;font-size:2.1rem;line-height:.95;display:block;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:6px}
/* food */
.foods{list-style:none;margin:0;padding:0}
.foods li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.foods li:first-child{border-top:0}
.foods .fn{flex:1;min-width:0;display:flex;flex-direction:column}
.foods .fn b{font-size:.92rem;font-weight:600}
.fmac{text-align:left;line-height:1.5;white-space:nowrap}
.foods.pick li{padding:0}
.foods.pick li > button:first-child{flex:1;min-width:0;text-align:start;display:flex;flex-direction:column;padding:10px 4px;min-height:52px}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);background:var(--accent-soft)}
.coachout{margin-top:12px;white-space:pre-wrap;font-size:.92rem;line-height:1.75}
.coachout:empty{display:none}
.coach{box-shadow:var(--shadow),inset 0 0 0 1px var(--accent-soft),inset 0 1px 0 var(--hl)}
/* map */
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hm .wl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--ink2);margin-top:12px}
.hm .wl:first-child{margin-top:0}
.cell{min-height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:transform .15s ease}
.cell:active{transform:scale(.93)}
.cell b{font-family:var(--f-x);font-weight:800;font-size:.98rem}
.cell .en{font-size:.74rem}
.cell.future{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink3)}
.cell.l0{background:var(--h0);color:var(--t-lo)} .cell.l1{background:var(--h1);color:var(--t-lo)} .cell.l2{background:var(--h2);color:var(--t-lo)}
.cell.l3{background:var(--h3);color:var(--t-hi)} .cell.l4{background:var(--h4);color:var(--t-hi)}
.cell.today{box-shadow:0 0 0 2.5px var(--gold),0 0 18px var(--gold-soft)}
.cell.sel{outline:2px solid var(--ink);outline-offset:2px}
.scale{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink2);margin-top:14px}
.scale i{width:22px;height:12px;border-radius:4px}

/* program */
.plan{display:grid;gap:8px}
.plan .pd{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--surface2)}
.plan .pd.now{box-shadow:inset 0 0 0 1.5px var(--accent)}
.plan .pd b{font-size:.86rem}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wlist li:first-child{border-top:0}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi b{display:block;font-size:2rem;line-height:1.1;text-align:right}
.kpi span{font-size:.78rem;color:var(--ink2)}
.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--ink3);font-family:var(--f-fa);font-size:22px}
.chart .gl{stroke:var(--line);stroke-width:1.2}
.tip{position:absolute;top:6px;inset-inline-start:6px;background:var(--ink);color:var(--bg);font-size:.78rem;padding:4px 10px;border-radius:8px;pointer-events:none}
.rates{display:flex;flex-wrap:wrap;gap:8px}
.rate{padding:8px 12px;border-radius:var(--r-md);background:var(--surface2);min-width:84px}
.rate b{font-size:1.15rem;display:block;text-align:right}
.rate span{font-size:.74rem;color:var(--ink2)}
.rate.ok{box-shadow:inset 0 -3px 0 var(--ok)} .rate.slow,.rate.fast{box-shadow:inset 0 -3px 0 var(--warn)}
.rule{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface2);margin-top:12px;font-size:.9rem}
.rule::before{content:"";width:3px;border-radius:2px;background:var(--ink3);flex:none}
.rule.ok::before{background:var(--ok)} .rule.warn::before{background:var(--warn)} .rule.bad::before{background:var(--bad)}
.ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:720px){.ch{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ch > div{display:flex;gap:10px;align-items:center;min-width:0}
.ch svg{width:48px;height:48px;flex:none;transform:rotate(-90deg)}
.ch b{font-size:1.15rem;display:block;line-height:1.1;text-align:right}
.ch span{font-size:.76rem;color:var(--ink2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:start;vertical-align:middle}
thead th{font-size:.74rem;color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line)}
tbody tr + tr td{border-top:1px solid var(--line)}
.tests tbody td:first-child{min-width:132px}
td .inp{min-height:44px;padding:6px 8px;text-align:center;direction:ltr;min-width:58px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin-top:14px}
@media (min-width:720px){.cmp{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cmp h3{font-size:.84rem;margin-bottom:6px}
.bars{display:grid;gap:5px}
.bars div{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;font-size:.74rem;color:var(--ink2)}
.bars i{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent));min-width:2px}
.bars em{font-style:normal;font-family:var(--f-x);font-weight:800;color:var(--ink);font-size:.86rem;margin-inline-start:6px}
.bars .bv{display:flex;align-items:center}
.prs{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.wk2 td:nth-child(n+2),.wk2 th:nth-child(n+2){text-align:center}

/* settings */
.list{overflow:hidden;padding:0}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px 16px;flex-wrap:wrap}
.li + .li{border-top:1px solid var(--line)}
.li .lbl{flex:1;min-width:140px}
.sect{font-size:.76rem;font-weight:600;color:var(--ink3);margin:22px 6px 8px}
.sect:first-child{margin-top:6px}
select.inp{appearance:none;-webkit-appearance:none;width:auto;min-width:130px}

/* tab bar */
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:24px;width:100%;max-width:500px;
  background:var(--panel-solid);background:var(--panel);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
nav.tabs button{flex:1;min-height:50px;border-radius:18px;font-weight:600;font-size:.82rem;color:var(--ink2);transition:background .25s ease,color .25s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{background:linear-gradient(140deg,var(--accent2),var(--accent));color:var(--on-accent)}

/* rest timer */
.timer{position:fixed;inset-inline:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:21;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.timer .in{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:20px;padding:8px 8px 8px 14px;width:100%;max-width:500px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.timer .t{font-family:var(--f-x);font-weight:800;font-size:1.6rem;direction:ltr;min-width:72px}
.timer .lb{flex:1;font-size:.8rem;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{min-height:44px;padding:0 12px;border-radius:12px;background:var(--surface2);color:var(--ink);font-weight:600;font-size:.84rem}
.timer .bar{position:absolute;inset-inline-start:0;bottom:0;height:3px;background:var(--gold);transition:width .25s linear}
.timer.ding .in{background:var(--gold);color:#1A1405}

/* sheet + dialog */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(3,6,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:600px}
.sheet .in{background:var(--panel-solid);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:inset 0 1px 0 var(--hl)}
.sheet[open] .in{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:1.15rem}
.sheet h3{font-size:.88rem;margin:14px 0 6px;color:var(--ink2)}
.sheet ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:.92rem}
.sheet p{font-size:.92rem}
.lrow{display:grid;grid-template-columns:20px 1.3fr 1fr 56px;gap:8px;align-items:center;padding:8px 0}
.lrow + .lrow{border-top:1px solid var(--line)}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:var(--r-md);overflow:hidden}
.step button{width:32px;min-height:46px;font-size:1.15rem;color:var(--ink2);flex:none}
.step input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-x);font-weight:800;font-size:1.05rem;min-height:46px;direction:ltr}
.step input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.rpe{min-height:46px;border-radius:var(--r-md);background:var(--surface2);border:0;padding:0 6px;font-family:var(--f-x);font-weight:700;width:100%;direction:ltr;text-align:center}
.plates{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px}
.plates i{display:inline-grid;place-items:center;height:30px;min-width:30px;padding:0 6px;border-radius:8px;font-style:normal;font-family:var(--f-x);font-weight:800;font-size:.76rem;color:var(--on-accent);background:var(--accent)}
.cdlg{margin:auto;width:min(400px,92vw)}
.cdlg .in{background:var(--panel-solid);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.toast{position:fixed;inset-inline:16px;top:calc(12px + env(safe-area-inset-top));max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;z-index:40;text-align:center;font-size:.9rem;box-shadow:var(--shadow);animation:up .25s ease}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line);border-radius:var(--r-lg);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/*__LOGIC__*/

/* ---------- UI helpers ---------- */
const SV = (d, w = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  prev: SV('<path d="M9 6l6 6-6 6"/>'), next: SV('<path d="M15 6l-6 6 6 6"/>'),

  map: SV('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>', 1.8),
  stats: SV('<path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/>', 1.8),
  food: SV('<path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7M7 7h4M17 3c-2.2 1.8-2.2 7.2 0 9v9"/>', 1.8),
  set: SV('<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>', 1.8),
};
const SHORT = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
const fmtDay = new Intl.DateTimeFormat("fa-IR", { day: "numeric" });
const bidi = s => esc(s).replace(/[A-Za-z0-9][A-Za-z0-9.\-/+×%' ]*[A-Za-z0-9%]|[A-Za-z0-9]/g, m => `<bdi dir="ltr">${m}</bdi>`);
const GROUP = { workout: 0, salt: 0, gtg: 0, tests: 0, mu: 0, kcal: 1, protein: 1, creatine: 1, walk: 2, water: 2, hang: 2, sleep: 2, checkin: 2 };
const GROUP_FA = ["تمرین", "تغذیه", "بدن و ریکاوری"];
const BARBELL = ["squat", "dl", "bench", "rdl", "bbrow", "ohp"];
const BIRTH = "2005-01-21";
const lvl = p => p < 0.1 ? 0 : p < 0.3 ? 1 : p < 0.55 ? 2 : p < 0.8 ? 3 : 4;
const setsOf = d => { if (d === "test") return 1; const m = /^(\d+)×/.exec(d || ""); return m ? +m[1] : 0; };
const repsOf = d => { const m = /×(\d+)(?:-(\d+))?/.exec(d || ""); return m ? { lo: +m[1], hi: m[2] ? +m[2] : +m[1] } : null; };
const fx = (s, cls = "x") => `<span class="${cls}">${s}</span>`;
function restSec(r) {
  const m = /(\d+)(?:-(\d+))?\s*(min|s)/.exec(r || ""); if (!m) return 90;
  const a = +m[1], b = m[2] ? +m[2] : a, v = (a + b) / 2;
  return Math.round(m[3] === "min" ? v * 60 : v);
}
let gid = 0;
function ring(p, size, stroke) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, id = "g" + (++gid), done = p >= 1;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${done ? "var(--ok)" : "var(--accent2)"}"/><stop offset="1" stop-color="${done ? "var(--ok)" : "var(--accent)"}"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" style="stroke:var(--surface2)"/>
    <circle class="val" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke="url(#${id})" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - clamp(p, 0, 1))).toFixed(2)}" ${p <= 0 ? 'opacity="0"' : ""}/></svg>`;
}
const infoBtn = k => `<button class="info" data-act="info" data-k="${k}" aria-label="توضیح این بخش">i</button>`;
const ph = (title, k, extra = "") => `<div class="ph"><h2>${title}</h2><div class="r">${extra}${k ? infoBtn(k) : ""}</div></div>`;
function ageOn(date) { const b = parseISO(BIRTH), d = parseISO(date); let a = d.getFullYear() - b.getFullYear(); if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--; return a; }
function bodyFat(sf, date) {
  if (!sf || !(sf.ch > 0 && sf.ab > 0 && sf.th > 0)) return null;
  const s = sf.ch + sf.ab + sf.th, bd = 1.10938 - 0.0008267 * s + 0.0000016 * s * s - 0.0002574 * ageOn(date);
  return 495 / bd - 450;
}

}
function platesFor(kg) {
  let side = (kg - 20) / 2; if (!(side > 0)) return [];
  const out = []; [25, 20, 15, 10, 5, 2.5, 1.25].forEach(p => { while (side >= p - 1e-9) { out.push(p); side -= p; } });
  return out;
}
function lastSession(exId, lib, before) {
  for (let i = before - 1; i >= 0; i--) { const p = peek(dateOf(i)); const L = p && p.lifts && p.lifts[exId]; if (L) { const m = L.filter(s => (s.ex || "") === lib && +s.reps > 0); if (m.length) return { i, sets: m }; } }
  return null;
}
function suggestion(ex, lib, dose) {
  const last = lastSession(ex.id, lib, sel); if (!last) return null;
  const top = last.sets.reduce((a, s) => (+s.kg || 0) >= (+a.kg || 0) ? s : a, last.sets[0]), kg = +top.kg || 0;
  const tgt = repsOf(dose), bw = BWLIFTS.includes(lib);
  const hit = tgt && last.sets.every(s => +s.reps >= tgt.hi) && last.sets.every(s => !s.rpe || +s.rpe <= 8.5);
  const prev = `${fa(kg)}${bw ? "+" : ""} kg × ${fa(top.reps)}`;
  let next;
  if (bw && !kg) next = hit ? "هر ست ۱ تکرار بیشتر" : "همان تکرارها، تمیزتر";
  else next = hit ? `${fa(kg + (BARBELL.includes(lib) ? 2.5 : 1.25))} kg` : `همان ${fa(kg)} kg`;
  return `جلسه قبل: <bdi dir="ltr">${prev}</bdi> · پیشنهاد امروز: ${next}`;
}

function session(inf, dd) {
  const W = PROGRAM.workouts[inf.letter], home = S.prefs.mode === "home";
  let done = 0, total = 0;
  const rows = W.ex.map((ex, idx) => {
    const lib = PROGRAM.lib, id = home ? ex.home : ex.gym, shown = lib[id], other = lib[home ? ex.gym : ex.home];
    const dose = doseOf(ex, inf.week, home), n = setsOf(dose), k = Math.min(dd.sets[ex.id] || 0, n);
    total += n; done += k;
    const logs = ((dd.lifts && dd.lifts[ex.id]) || []).filter(s => (s.ex || "") === id);
    const sug = ex.main && n ? suggestion(ex, id, dose) : null;
    let dots = "";
    for (let s = 1; s <= n; s++) dots += `<button class="dot ${s <= k ? "on" : ""}" data-act="set" data-id="${ex.id}" data-n="${s}" data-max="${n}" data-rest="${restSec(ex.rest)}" aria-pressed="${s <= k}" aria-label="${esc(shown.en)} ست ${fa(s)} از ${fa(n)}">${fa(s)}</button>`;
    return `<article class="ex ${n && k >= n ? "done" : ""}">
      <div class="ex-top"><div style="min-width:0"><span class="faint tiny num">${fa(idx + 1)} </span><button class="ename" lang="en" data-act="exinfo" data-ex="${ex.id}" data-w="${inf.letter}">${esc(shown.en)}</button>
        <p class="meta">${shown.en === other.en ? "باشگاه و خانه: همین حرکت" : `${home ? "باشگاه" : "خانه"}: ${en(other.en)}`} · استراحت ${en(ex.rest)}</p></div>
        <span class="dose">${esc(dose === "test" ? "Test" : dose)}</span></div>
      ${ex.fa ? `<p class="meta" style="margin-top:6px">${bidi(ex.fa)}</p>` : ""}
      ${sug ? `<p class="hint-line">${sug}</p>` : ""}
      ${n ? `<div class="sets">${dots}${ex.main ? `<button class="linkbtn" data-act="log" data-id="${ex.id}" data-lib="${id}">ثبت وزنه${logs.length ? " · " + fa(logs.length) : ""}</button>` : ""}</div>` : `<p class="hint">این هفته اجرا نمی‌شود.</p>`}
    </article>`;
  }).join("");
  const sp = total ? done / total : 0, wd = !!dd.done.workout;
  const body = `<div class="sess-h"><div><button class="x wolink" lang="en" data-act="wopage" data-w="${inf.letter}">WORKOUT ${inf.letter}</button><span class="muted small">${esc(W.fa.split(":")[1] || W.fa)}</span></div>
      <div style="display:flex;gap:8px;align-items:center"><div class="seg" role="group" aria-label="نسخه تمرین"><button data-act="mode" data-v="gym" aria-pressed="${!home}">${en("Gym")}</button><button data-act="mode" data-v="home" aria-pressed="${home}">${en("Home")}</button></div>${infoBtn("session")}</div></div>
    <div class="prog" role="progressbar" aria-label="پیشرفت جلسه" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${(sp * 100).toFixed(1)}%"></i></div>
    <p class="tiny muted num">${fa(done)} از ${fa(total)} ست · روی هر ست بزن تا تایمر استراحت شروع شود</p>
    <details class="fold" data-d="wu" ${openD.has("wu") ? "open" : ""}><summary>گرم کردن ۸ تا ۱۰ دقیقه</summary><ul class="wu">${PROGRAM.warmup.map(w => `<li>${en(w[0])}<span class="en">${esc(w[1])}</span></li>`).join("")}</ul></details>
    ${rows}
    <button class="btn ${wd ? "done" : "pri"} block tick" style="margin-top:14px" data-act="tog" data-k="workout" aria-pressed="${wd}">${wd ? "جلسه انجام شد" : "پایان جلسه"}</button>`;
  if (inf.mu) return `<section class="panel rise" style="--i:1"><details class="fold" style="border:0;margin:0" data-d="mu" ${openD.has("mu") ? "open" : ""}><summary>تمرین ${inf.letter} (سبک، فقط بعد از تست‌ها اگر تازه‌ای)</summary>${body}</details></section>`;
  return `<section class="panel rise" style="--i:1" aria-label="جلسه تمرین">${body}</section>`;
}

function walkDay(inf, dd) {

/* ---------- stats ---------- */
let chartPts = [];
function lineSeries(vals, W, H, lo, hi, L, R, T, B) {
  const X = i => W - R - i / 55 * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  return { X, Y };
}
function weightChart(cur) {
  const W = 640, H = 290, L = 50, R = 14, T = 16, B = 38;
  const pts = []; for (let i = 0; i < 56; i++) { const w = weightOn(dateOf(i)); if (w) pts.push({ i, w, a: avg7(i) }); }
  chartPts = [];
  if (!pts.length) return `<div class="empty">وزن صبح را در «ثبت روز» وارد کن تا نمودار ساخته شود.</div>`;
  const all = pts.map(p => p.w).concat([TARGET_W, START_W]);
  const lo = Math.floor(Math.min(...all) - 0.5), hi = Math.ceil(Math.max(...all) + 0.5);
  const { X, Y } = lineSeries(null, W, H, lo, hi, L, R, T, B);
  chartPts = pts.map(p => ({ ...p, x: X(p.i) }));
  let s = `<svg class="chart" id="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="روند وزن، آخرین میانگین ۷ روزه ${faN(pts[pts.length - 1].a, 1)} کیلوگرم"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient><linearGradient id="gl" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="var(--accent2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>`;
  const step = hi - lo > 8 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 7}" text-anchor="end">${fa(v)}</text>`;
  for (let w = 0; w < 8; w++) s += `<text x="${X(w * 7 + 3)}" y="${H - 10}" text-anchor="middle">${fa(w + 1)}</text>`;
  s += `<line x1="${X(0)}" y1="${Y(START_W)}" x2="${X(55)}" y2="${Y(TARGET_W)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 7"/>`;
  if (pts.length > 1) {
    const line = pts.map(p => `${X(p.i).toFixed(1)},${Y(p.a).toFixed(1)}`).join(" ");
    s += `<polygon points="${X(pts[0].i).toFixed(1)},${H - B} ${line} ${X(pts[pts.length - 1].i).toFixed(1)},${H - B}" fill="url(#ga)"/>`;
    s += `<polyline points="${line}" fill="none" stroke="url(#gl)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach(p => { s += `<circle cx="${X(p.i)}" cy="${Y(p.w)}" r="3.5" fill="var(--ink3)"/>`; });
  const last = pts[pts.length - 1];
  s += `<circle cx="${X(last.i)}" cy="${Y(last.a)}" r="8" fill="var(--accent)" stroke="var(--panel-solid)" stroke-width="3"/>`;
  s += `<line id="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink3)" stroke-width="1" visibility="hidden"/>`;
  if (cur >= 0 && cur <= 55) s += `<line x1="${X(cur)}" x2="${X(cur)}" y1="${T}" y2="${H - B}" stroke="var(--gold)" stroke-width="1.5" opacity=".6"/>`;
  return `<div class="chartwrap">${s}</svg><div class="tip" id="tip" hidden></div></div>`;
}
function miniChart(pts, label, unit, color) {
  if (pts.length < 1) return `<div class="empty small">هنوز ثبتی نیست.</div>`;
  const W = 640, H = 200, L = 50, R = 14, T = 16, B = 34, vs = pts.map(p => p.v), lo = Math.floor(Math.min(...vs) - 1), hi = Math.ceil(Math.max(...vs) + 1);
  const { X, Y } = lineSeries(null, W, H, lo, hi, L, R, T, B), step = Math.max(1, Math.ceil((hi - lo) / 4));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}: ${pts.map(p => faN(p.v, 1)).join("، ")} ${unit}">`;
  for (let v = lo; v <= hi; v += step) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 7}" text-anchor="end">${fa(v)}</text>`;
  for (let w = 0; w < 8; w++) s += `<text x="${X(w * 7 + 3)}" y="${H - 8}" text-anchor="middle">${fa(w + 1)}</text>`;
  if (pts.length > 1) s += `<polyline points="${pts.map(p => `${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p => { s += `<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="5" fill="${color}" stroke="var(--panel-solid)" stroke-width="2"/>`; });
  return s + `</svg>`;
}

/* ---------- rest timer ---------- */
const TM = { end: 0, total: 0, id: 0, label: "" };
let actx = null;
function beep() {

    if (actx) {
      const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5);
      o.start(); o.stop(actx.currentTime + 0.55);
    }
  } catch (e) {}

}
function startTimer(sec, label) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
  clearTimeout(TM.hide); TM.end = Date.now() + sec * 1000; TM.total = sec; TM.label = label; clearInterval(TM.id); TM.id = setInterval(tickTimer, 250); tickTimer();
}
function stopTimer() { clearInterval(TM.id); clearTimeout(TM.hide); TM.end = 0; document.body.classList.remove("has-timer"); const el = $("#timer"); el.hidden = true; el.classList.remove("ding"); }
function tickTimer() {
  const el = $("#timer"); if (!TM.end) return;
  const left = Math.max(0, Math.ceil((TM.end - Date.now()) / 1000)), mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
  el.hidden = false; document.body.classList.add("has-timer");

    clearInterval(TM.id); TM.end = 0; el.classList.add("ding"); beep();

    TM.hide = setTimeout(stopTimer, 8000); return;
  }
  el.classList.remove("ding");
  el.innerHTML = `<div class="in"><span class="t num">${fa(mm + ":" + ss)}</span><span class="lb">استراحت · ${esc(TM.label)}</span><button data-act="tadd"><bdi dir="ltr">+۳۰</bdi></button><button data-act="tstop">رد کن</button><span class="bar" style="width:${(left / TM.total * 100).toFixed(1)}%"></span></div>`;
}

}

        S = n; save(); applyTheme(); sel = clamp(todayIdx(), 0, 55); render(); toast("پشتیبان وارد شد."); });
    };
    r.readAsText(f);
  }
});
document.addEventListener("input", e => {
  const el = e.target, a = el.dataset && el.dataset.act; if (!FS) return;
  if (a === "fsearch") { FS.q = el.value; const l = $("#flist"); if (l) l.innerHTML = foodList(); }
  if (a === "famt") { FS.amt = el.value; const p = $("#fprev"); if (p) p.innerHTML = previewHtml(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "famt") { e.preventDefault(); const b = document.querySelector('[data-act="fsave"]'); if (b) b.click(); } });
/* swipe between days */
let sx = null, sy = 0;
$("#view").addEventListener("touchstart", e => { if (tab !== "today" || e.touches.length !== 1 || e.target.closest(".tw,.chart,input,textarea,select,.week,.scale5")) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("#view").addEventListener("touchend", e => {
  if (sx === null) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) setSel(sel + (dx > 0 ? 1 : -1));
}, { passive: true });
let lastISO = todayISO();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayISO() !== lastISO) { lastISO = todayISO(); sel = clamp(todayIdx(), 0, 55); render(); } if (!document.hidden && TM.end) tickTimer(); });
window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { S = load(); render(); } });

/* ---------- cloud sync (artifact viewer: per-user private db doc) ---------- */
let pushT = 0;
function push() { clearTimeout(pushT); pushT = setTimeout(() => { if (cloudRef) cloudRef.set({ s: JSON.stringify(S), t: savedAt }).catch(() => {}); }, 800); }
async function pull() {
  if (!cloudRef) return;
  try {
    const snap = await cloudRef.get(), d = snap.exists ? snap.data() : null;
    const n = d && typeof d.s === "string" ? normalize(JSON.parse(d.s)) : null;
    if (n && (+d.t || 0) > savedAt) { S = n; savedAt = +d.t; save(true); applyTheme(); sel = clamp(todayIdx(), 0, 55); render(); }
    else if (Object.keys(S.days).length || Object.keys(S.tests).length) push();
  } catch (e) {}
}
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const id = user && await user.id(); if (!db || !id) return;
    cloudRef = db.doc("data/users/" + id + "/tracker"); onSaved = push;
    claude.use("sample").then(s => { smp = s; if (s && (tab === "stats" || tab === "food") && !page) render(); }).catch(() => {});
    await pull(); const sv = $("#sv"); if (sv) sv.textContent = "همگام‌سازی ابری فعال است. داده‌ها در حساب Claude تو ذخیره می‌شوند.";
  } catch (e) {}
})();
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
applyTheme();
render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
