<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترکر برش ۸ هفته‌ای</title>
<meta name="description" content="ترکر تعاملی ۸ هفته: حفظ عضله، قدرت کل بدن، لاغری و رسیدن به ۸-۱۰ Pull-up">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cut 8W">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
__FONTS__
/* Layout: phone-first training console. One column on phones, two columns (session | day) from 960px.
   Radius rule: containers 20px, controls 12px, chips and pips fully round. */
:root{
  --bg:#EEF1F5; --surface:#FAFBFC; --surface2:#E6EAF0; --line:#D7DDE5; --ink:#0F1622; --ink2:#4B5768; --ink3:#6E7A8B;
  --accent:#2F66D8; --accent-ink:#1E52BC; --on-accent:#FFFFFF; --accent-soft:#DCE6FA;
  --gold:#B07D17; --gold-soft:#F4E7C8; --ok:#1E845A; --warn:#A8620F; --bad:#BD3D36;
  --h0:#E3E8EF; --h1:#C9D7F0; --h2:#9DB8EA; --h3:#3F72DB; --h4:#24509F; --t-lo:#0F1622; --t-hi:#FFFFFF;
  --shadow:0 1px 2px rgba(20,40,80,.06),0 8px 24px rgba(20,40,80,.06);
  --r-lg:20px; --r-md:12px;
  --f-fa:'Vazirmatn','Tahoma','Segoe UI',system-ui,sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E13; --surface:#141922; --surface2:#1C2330; --line:#262F3D; --ink:#EDF1F6; --ink2:#A3AEBD; --ink3:#7C8798;
    --accent:#5B93FF; --accent-ink:#8FB4FF; --on-accent:#07101F; --accent-soft:#1A2741;
    --gold:#E7B65A; --gold-soft:#3A2F17; --ok:#4CCB93; --warn:#F2A85A; --bad:#F27A72;
    --h0:#1B2230; --h1:#22334F; --h2:#2D4C80; --h3:#5B93FF; --h4:#A9C6FF; --t-lo:#EDF1F6; --t-hi:#07101F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#141922; --surface2:#1C2330; --line:#262F3D; --ink:#EDF1F6; --ink2:#A3AEBD; --ink3:#7C8798;
  --accent:#5B93FF; --accent-ink:#8FB4FF; --on-accent:#07101F; --accent-soft:#1A2741;
  --gold:#E7B65A; --gold-soft:#3A2F17; --ok:#4CCB93; --warn:#F2A85A; --bad:#F27A72;
  --h0:#1B2230; --h1:#22334F; --h2:#2D4C80; --h3:#5B93FF; --h4:#A9C6FF; --t-lo:#EDF1F6; --t-hi:#07101F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-fa);font-size:16px;line-height:1.65;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.en{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate;font-weight:600;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:.86rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:var(--r-md);z-index:30}
.skip:focus{top:12px}
.app{max-width:1120px;margin:0 auto;padding:0 16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand h1{font-size:1.05rem;font-weight:700}
.brand .en{font-size:.85rem;color:var(--ink3);display:block;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 12px;border-radius:999px;background:var(--surface2);font-size:.82rem;font-weight:500;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

/* generic card */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.card + .card,.stack > * + *{margin-top:14px}
.card h2{font-size:1.02rem;font-weight:700}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid2{display:grid;gap:14px}
@media (min-width:960px){.grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 14px}
.wd{min-height:72px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);transition:background .2s ease,transform .15s ease}
.wd:active{transform:scale(.96)}
.wd .dn{font-size:.72rem}
.wd .dd{font-family:var(--f-num);font-weight:700;font-size:1.05rem;color:var(--ink)}
.wd svg{width:26px;height:26px;transform:rotate(-90deg)}
.wd[aria-current="date"]{background:var(--surface);box-shadow:var(--shadow)}
.wd.today .dd{color:var(--gold)}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink2);transition:background .2s ease}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.35;cursor:default}

/* hero */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,var(--accent-soft),transparent 60%);opacity:.8;pointer-events:none}
.hero > *{position:relative}
.ring{width:128px;height:128px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .ctr b{font-family:var(--f-num);font-size:2.3rem;font-weight:700;display:block}
.ring .ctr span{font-size:.75rem;color:var(--ink2)}
.hero h2{font-size:1.35rem;font-weight:700}
.hero .sub{color:var(--ink2);font-size:.88rem;margin-top:2px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini{display:none}
@media (min-width:720px){.hero{grid-template-columns:auto 1fr auto}.mini{display:grid;grid-template-columns:repeat(3,auto);gap:28px;align-items:end}.mini b{font-family:var(--f-num);font-weight:700;font-size:1.8rem;display:block;line-height:1;direction:ltr;text-align:right}.mini span{font-size:.78rem;color:var(--ink2)}}
.strip{grid-column:1/-1;display:flex;gap:2px;margin-top:4px}
.strip i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.strip i.w{margin-inline-start:4px}
.strip i.cur{background:var(--gold);height:10px;margin-top:-2px}
@media (max-width:380px){.ring{width:108px;height:108px}.ring .ctr b{font-size:1.9rem}}

/* notices */
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border-inline-start:3px solid var(--gold);margin-top:10px;font-size:.92rem}
.notice b{display:block;font-size:.95rem}
.notice.acc{border-color:var(--accent)}

/* session */
.sess-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sess-title .en{font-size:1.9rem;font-weight:700;line-height:1}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r-md);padding:3px}
.seg button{min-height:38px;min-width:64px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--ink2);transition:background .2s ease,color .2s ease}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
details.fold{border-top:1px solid var(--line);margin-top:12px}
details.fold > summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-3px) rotate(45deg);transition:transform .2s ease;margin-inline-end:6px;flex:none}
details.fold[open] > summary::after{transform:translateY(2px) rotate(-135deg)}
.wu{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.wu li{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex.done .ename{color:var(--ink2)}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ename{font-size:1.25rem;font-family:var(--f-num);font-weight:600;color:var(--ink);text-decoration:none;line-height:1.2;display:inline-block}
.ename:hover{color:var(--accent-ink)}
.dose{font-family:var(--f-num);font-weight:700;font-size:1.35rem;color:var(--accent-ink);white-space:nowrap;direction:ltr}
.meta{font-size:.84rem;color:var(--ink2);margin-top:2px}
.meta .en,.meta bdi{white-space:nowrap}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.dot{width:44px;height:44px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:var(--ink3);transition:background .2s ease,border-color .2s ease,transform .15s ease}
.dot:active{transform:scale(.9)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.linkbtn{min-height:44px;padding:0 12px;border-radius:var(--r-md);color:var(--accent-ink);font-weight:600;font-size:.88rem}
.linkbtn:hover{background:var(--accent-soft)}
.skipwk{font-size:.86rem;color:var(--ink3);margin-top:6px}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:var(--r-md);background:var(--surface2);font-weight:600;transition:transform .15s ease,background .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}

/* checklist */
.grp + .grp{margin-top:14px}
.grp h3{font-size:.8rem;font-weight:600;color:var(--ink3);margin-bottom:4px}
.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 4px;text-align:start;border-radius:var(--r-md);transition:background .2s ease}
.chk:hover{background:var(--surface2)}
.chk .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink3);display:grid;place-items:center;transition:background .2s ease,border-color .2s ease}
.chk .box svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:opacity .2s ease,transform .2s ease}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] .box svg{opacity:1;transform:none}
.chk[aria-pressed="true"] .lbl{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.chk .lbl{flex:1;min-width:0;font-size:.95rem}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 4px;flex-wrap:wrap}
.row .lbl{flex:1;min-width:140px;font-size:.95rem}
.pips{display:flex;gap:6px;flex:none}
.pip{width:36px;height:36px;border-radius:999px;border:2px solid var(--line);font-family:var(--f-num);font-weight:700;font-size:.9rem;color:var(--ink3);transition:background .2s ease;position:relative}
.pip::after{content:"";position:absolute;inset:-4px}
.pip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* water */
.water{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.tank{width:64px;height:100px;border-radius:14px 14px 18px 18px;border:2px solid var(--accent);position:relative;overflow:hidden;background:var(--surface2)}
.tank i{position:absolute;inset-inline:0;bottom:0;background:var(--accent);opacity:.85;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.big{font-family:var(--f-num);font-weight:700;font-size:2rem;line-height:1;direction:ltr;display:inline-block}
.wbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* fuel */
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.macro div{min-width:0}
.macro b{font-family:var(--f-num);font-weight:700;font-size:1.6rem;display:block;line-height:1.1;direction:ltr;text-align:right}
.macro span{font-size:.78rem;color:var(--ink2)}
.ratio{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:12px}
.ratio i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* fields */
.fld + .fld{margin-top:12px}
label.f{display:block;font-size:.86rem;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.inp{width:100%;min-height:48px;padding:10px 14px;background:var(--surface2);border:1.5px solid transparent;border-radius:var(--r-md);transition:border-color .2s ease,background .2s ease}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.inp{min-height:92px;resize:vertical}
.hint{font-size:.8rem;color:var(--ink3);margin-top:6px}

/* map */
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hm .wl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--ink2);margin-top:10px}
.hm .wl:first-child{margin-top:0}
.cell{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:transform .15s ease}
.cell:active{transform:scale(.94)}
.cell b{font-family:var(--f-num);font-size:1.05rem}
.cell .en{font-size:.78rem;opacity:.85}
.cell.future{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink3)}
.cell.l0{background:var(--h0);color:var(--t-lo)} .cell.l1{background:var(--h1);color:var(--t-lo)} .cell.l2{background:var(--h2);color:var(--t-lo)}
.cell.l3{background:var(--h3);color:var(--t-hi)} .cell.l4{background:var(--h4);color:var(--t-hi)}
.cell.today{box-shadow:0 0 0 2.5px var(--gold)}
.cell.sel{outline:2px solid var(--ink);outline-offset:2px}
.scale{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink2);margin-top:14px}
.scale i{width:22px;height:12px;border-radius:4px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px}
.kpi b{font-family:var(--f-num);font-weight:700;font-size:2.1rem;line-height:1.1;display:block;direction:ltr;text-align:right}
.kpi span{font-size:.8rem;color:var(--ink2)}
.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--ink3);font-family:var(--f-fa);font-size:22px}
.chart .gl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;top:6px;inset-inline-start:6px;background:var(--ink);color:var(--bg);font-size:.8rem;padding:4px 10px;border-radius:8px;pointer-events:none}
.rates{display:flex;flex-wrap:wrap;gap:8px}
.rate{padding:8px 12px;border-radius:var(--r-md);background:var(--surface2);min-width:84px}
.rate b{font-family:var(--f-num);font-size:1.25rem;display:block;direction:ltr;text-align:right}
.rate span{font-size:.76rem;color:var(--ink2)}
.rate.ok{box-shadow:inset 0 -3px 0 var(--ok)} .rate.slow,.rate.fast{box-shadow:inset 0 -3px 0 var(--warn)}
.rule{padding:12px 14px;border-radius:var(--r-md);background:var(--surface2);margin-top:12px;font-size:.92rem;border-inline-start:3px solid var(--ink3)}
.rule.ok{border-color:var(--ok)} .rule.warn{border-color:var(--warn)} .rule.bad{border-color:var(--bad)}
.ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:720px){.ch{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ch > div{display:flex;gap:10px;align-items:center;min-width:0}
.ch svg{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.ch b{font-family:var(--f-num);font-size:1.3rem;display:block;line-height:1.1;direction:ltr;text-align:right}
.ch span{font-size:.78rem;color:var(--ink2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;text-align:start;vertical-align:middle}
thead th{font-size:.78rem;color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line)}
tbody tr + tr td{border-top:1px solid var(--line)}
.tests tbody td:first-child{min-width:132px}
td .inp{min-height:44px;padding:6px 8px;text-align:center;direction:ltr;min-width:58px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin-top:14px}
@media (min-width:720px){.cmp{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cmp h3{font-size:.86rem;margin-bottom:6px}
.bars{display:grid;gap:5px}
.bars div{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;font-size:.76rem;color:var(--ink2)}
.bars i{display:block;height:14px;border-radius:4px;background:var(--accent);min-width:2px}
.bars em{font-style:normal;font-family:var(--f-num);font-weight:700;color:var(--ink);font-size:.9rem;margin-inline-start:6px}
.bars .bv{display:flex;align-items:center}
.prs{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* settings */
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 16px;flex-wrap:wrap}
.li + .li{border-top:1px solid var(--line)}
.li .lbl{flex:1;min-width:140px}
.sect{font-size:.8rem;font-weight:600;color:var(--ink3);margin:22px 4px 8px}
.sect:first-child{margin-top:6px}
select.inp{appearance:none;-webkit-appearance:none;width:auto;min-width:130px}

/* tab bar */
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:22px;width:100%;max-width:440px;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
nav.tabs button{flex:1;min-height:48px;border-radius:16px;font-weight:600;font-size:.9rem;color:var(--ink2);transition:background .2s ease,color .2s ease}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* rest timer */
.timer{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:21;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.timer .in{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 14px;width:100%;max-width:440px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.timer .t{font-family:var(--f-num);font-weight:700;font-size:1.6rem;direction:ltr;min-width:64px}
.timer .lb{flex:1;font-size:.82rem;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{min-height:44px;padding:0 12px;border-radius:12px;background:var(--surface2);color:var(--ink);font-weight:600;font-size:.85rem}
.timer .bar{position:absolute;inset-inline-start:0;bottom:0;height:3px;background:var(--gold);transition:width .25s linear}
.timer.ding .in{background:var(--gold);color:#1A1405}

/* sheet + dialog */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(5,8,14,.5)}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px}
.sheet .in{background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sheet[open] .in{animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.lrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:10px;align-items:center;padding:8px 0}
.lrow + .lrow{border-top:1px solid var(--line)}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:var(--r-md);overflow:hidden}
.step button{width:44px;min-height:46px;font-size:1.2rem;color:var(--ink2);flex:none}
.step input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-weight:700;font-size:1.15rem;min-height:46px;direction:ltr}
.step input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.cdlg{margin:auto;width:min(400px,92vw)}
.cdlg .in{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.toast{position:fixed;inset-inline:16px;top:calc(12px + env(safe-area-inset-top));max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:40;text-align:center;font-size:.92rem;box-shadow:var(--shadow);animation:up .25s ease}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line);border-radius:var(--r-lg);font-size:.92rem}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#view">پرش به محتوا</a>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="2.4" rx="1.2" fill="var(--bg)"/><rect x="5" y="5" width="3" height="4.4" rx="1" fill="var(--gold)"/><rect x="16" y="5" width="3" height="4.4" rx="1" fill="var(--gold)"/><rect x="6" y="12" width="2" height="7" rx="1" fill="var(--bg)"/><rect x="11" y="12" width="2" height="5" rx="1" fill="var(--bg)"/><rect x="16" y="12" width="2" height="7" rx="1" fill="var(--bg)"/></svg></span>
      <div><h1>برش ۸ هفته‌ای</h1><span class="en" lang="en">8-Week Cut</span></div>
    </div>
    <span id="phase" class="pill acc"></span>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" aria-label="بخش‌ها"><div class="in" id="tabs"></div></nav>
<div id="timer" class="timer" hidden role="timer" aria-live="off"></div>
<dialog id="sheet" class="sheet" aria-labelledby="sht"></dialog>
<dialog id="dlg" class="cdlg" aria-labelledby="dt"></dialog>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<noscript><p class="app">برای استفاده از ترکر جاوااسکریپت لازم است.</p></noscript>

<script>
"use strict";
/*__LOGIC__*/

/* ---------- UI helpers ---------- */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
};
const SHORT = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
const bidi = s => esc(s).replace(/[A-Za-z0-9][A-Za-z0-9.\-/+×%' ]*[A-Za-z0-9%]|[A-Za-z0-9]/g, m => `<bdi dir="ltr">${m}</bdi>`);
const fmtDay = new Intl.DateTimeFormat("fa-IR", { day: "numeric" });
const GROUP = { workout: 0, salt: 0, gtg: 0, tests: 0, mu: 0, kcal: 1, protein: 1, creatine: 1, walk: 2, water: 2, hang: 2, sleep: 2, checkin: 2 };
const GROUP_FA = ["تمرین", "تغذیه", "بدن و ریکاوری"];
const lvl = p => p < 0.1 ? 0 : p < 0.3 ? 1 : p < 0.55 ? 2 : p < 0.8 ? 3 : 4;
const setsOf = d => { if (d === "test") return 1; const m = /^(\d+)×/.exec(d || ""); return m ? +m[1] : 0; };
function restSec(r) {
  const m = /(\d+)(?:-(\d+))?\s*(min|s)/.exec(r || ""); if (!m) return 90;
  const a = +m[1], b = m[2] ? +m[2] : a, v = (a + b) / 2;
  return Math.round(m[3] === "min" ? v * 60 : v);
}
function ring(p, size, stroke) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" style="stroke:var(--surface2)"/>
    <circle class="val" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - clamp(p, 0, 1))).toFixed(2)}" style="stroke:${p >= 1 ? "var(--ok)" : "var(--accent)"}${p <= 0 ? ";opacity:0" : ""}"/></svg>`;
}

/* ---------- state ---------- */
let tab = "today";
let sel = clamp(todayIdx(), 0, 55);
const openD = new Set();
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
function setSel(i) { sel = clamp(i, 0, 55); render(); }
function applyTheme() {
  const t = S.prefs.theme;
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}

/* ---------- today ---------- */
function weekStrip(inf) {
  const base = (inf.week - 1) * 7, cur = todayIdx();
  let h = `<div class="weekbar"><button class="iconbtn" data-act="prev" aria-label="روز قبل" ${sel === 0 ? "disabled" : ""}>${ICON.prev}</button>
    <div class="small muted">هفته ${fa(inf.week)} از ۸ · ${esc(inf.phaseFa)}</div>
    <button class="iconbtn" data-act="next" aria-label="روز بعد" ${sel === 55 ? "disabled" : ""}>${ICON.next}</button></div><div class="week" role="group" aria-label="روزهای هفته">`;
  for (let d = 0; d < 7; d++) {
    const i = base + d, f = info(i), p = pct(i), dn = fmtDay.format(parseISO(f.date));
    h += `<button class="wd ${i === cur ? "today" : ""}" data-act="open" data-i="${i}" ${i === sel ? 'aria-current="date"' : ""} aria-label="${DAYFA[d]} ${dn}، ${fa(Math.round(p * 100))} درصد">
      <span class="dn">${SHORT[d]}</span><span class="dd">${dn}</span>${ring(p, 26, 4)}</button>`;
  }
  return h + `</div>`;
}

function hero(inf) {
  const p = pct(sel), cur = todayIdx();
  const jd = fmtJ.format(parseISO(inf.date)), gd = fmtG.format(parseISO(inf.date));
  let strip = "";
  for (let i = 0; i < 56; i++) strip += `<i class="${i % 7 === 0 && i ? "w" : ""} ${i === sel ? "cur" : ""}" style="${i !== sel && i <= cur ? `background:var(--h${Math.max(1, lvl(pct(i)))})` : ""}"></i>`;
  return `<section class="card hero fade" aria-label="خلاصه روز">
    <div class="ring">${ring(p, 128, 11)}<div class="ctr"><div><b class="num">${fa(Math.round(p * 100))}<small style="font-size:.5em">٪</small></b><span>انجام شده</span></div></div></div>
    <div style="min-width:0"><h2>${esc(DAYFA[inf.dow])}، ${esc(jd)}</h2><p class="sub">${esc(gd)} · روز ${fa(sel + 1)} از ۵۶</p>
      <div class="chips">${inf.letter ? `<span class="pill acc">${en("Workout " + inf.letter)}</span>` : `<span class="pill">روز پیاده‌روی</span>`}
      ${inf.refeed ? `<span class="pill gold">ریفید</span>` : ""}${inf.test ? `<span class="pill gold">روز تست</span>` : ""}
      ${sel !== cur && cur >= 0 && cur <= 55 ? `<button class="pill" data-act="today" style="min-height:32px">برو به امروز</button>` : ""}</div></div>
    <div class="mini num" aria-label="خلاصه"><div><b>${fa(PROGRAM.nutrition[inf.type].kcal)}</b><span>کیلوکالری هدف</span></div><div><b>${fa(String(Number(((peek(inf.date) || {}).water || 0) / 1000).toFixed(1)))}/${fa(waterTarget(inf) / 1000)}</b><span>آب (لیتر)</span></div><div><b>${(peek(inf.date) || {}).steps ? fa(((peek(inf.date) || {}).steps / 1000).toFixed(1)) + "k" : "-"}</b><span>قدم</span></div></div>
    <div class="strip" aria-hidden="true">${strip}</div></section>`;
}

function notices(inf) {
  const cur = todayIdx(); let h = "";
  if (cur < 0) h += `<div class="notice acc"><div><b>برنامه ${fa(-cur)} روز دیگر شروع می‌شود</b>شروع: ${esc(fmtJ.format(startDate()))}. روزها را از قبل ببین.</div></div>`;
  if (cur > 55) h += `<div class="notice"><div><b>۸ هفته تمام شد</b>نتیجه‌ها در بخش آمار.</div></div>`;
  if (inf.deload) h += `<div class="notice"><div><b>هفته دیلود</b>نصف ست‌ها، وزنه‌ی سبک‌تر. جمعه تست میانی.</div></div>`;
  if (inf.week === 8 && !inf.mu) h += `<div class="notice"><div><b>هفته اوج و تست</b>حجم کم. جمعه ${en("Pull-up Test Day")}.</div></div>`;
  if (inf.refeed) h += `<div class="notice"><div><b>ریفید</b>کربوهیدرات اضافه از برنج، ماکارونی، سیب‌زمینی و میوه، نه از چربی.</div></div>`;
  if (inf.mu) h += `<div class="notice"><div><b>${en("Pull-up Test Day")}</b>گرم کردن کامل، یک ست ${en("Max Strict Pull-up")} (هدف ۸ تا ۱۰)، ۵ دقیقه استراحت، ست دوم اختیاری. اهداف دوم: ۸ ${en("Dip")} و ۶ ${en("Chin-up")}. اگر ۸ یا بیشتر زدی، ۳ تلاش اختیاری ${en("Muscle-Up")}.</div></div>`;
  else if (inf.test) h += `<div class="notice"><div><b>روز تست</b>بعد از گرم کردن، بین هر تست ۳ تا ۵ دقیقه استراحت. نتایج را در آمار ثبت کن.</div></div>`;
  return h;
}

function session(inf, dd) {
  const W = PROGRAM.workouts[inf.letter], home = S.prefs.mode === "home";
  let done = 0, total = 0;
  const rows = W.ex.map((ex, idx) => {
    const lib = PROGRAM.lib, id = home ? ex.home : ex.gym, shown = lib[id], other = lib[home ? ex.gym : ex.home];
    const dose = doseOf(ex, inf.week, home), n = setsOf(dose), k = Math.min(dd.sets[ex.id] || 0, n);
    total += n; done += k;
    const href = GUIDE ? GUIDE + "#ex-" + id : "https://www.youtube.com/results?search_query=" + encodeURIComponent(shown.yt);
    const logs = (dd.lifts && dd.lifts[ex.id]) || [];
    let dots = "";
    for (let s = 1; s <= n; s++) dots += `<button class="dot ${s <= k ? "on" : ""}" data-act="set" data-id="${ex.id}" data-n="${s}" data-max="${n}" data-rest="${restSec(ex.rest)}" aria-pressed="${s <= k}" aria-label="${esc(shown.en)} ست ${fa(s)} از ${fa(n)}">${fa(s)}</button>`;
    return `<article class="ex ${n && k >= n ? "done" : ""}">
      <div class="ex-top"><div style="min-width:0"><span class="faint small num">${fa(idx + 1)} </span>
        <a class="ename en" lang="en" href="${href}" target="_blank" rel="noopener">${esc(shown.en)}</a>
        <p class="meta">${shown.en === other.en ? "باشگاه و خانه: همین حرکت" : `${home ? "باشگاه" : "خانه"}: ${en(other.en)}`} · استراحت ${en(ex.rest)}</p></div>
        <span class="dose">${esc(dose === "test" ? "Test" : dose)}</span></div>
      ${ex.fa ? `<p class="meta" style="margin-top:6px">${bidi(ex.fa)}</p>` : ""}
      ${n ? `<div class="sets">${dots}${ex.main ? `<button class="linkbtn" data-act="log" data-id="${ex.id}" data-lib="${id}">ثبت وزنه${logs.length ? " · " + fa(logs.length) : ""}</button>` : ""}</div>` : `<p class="skipwk">این هفته اجرا نمی‌شود.</p>`}
    </article>`;
  }).join("");
  const sp = total ? done / total : 0, wd = !!dd.done.workout;
  const body = `<div class="head" style="margin:0;flex-wrap:wrap"><div class="sess-title"><span class="en" lang="en">Workout ${inf.letter}</span><span class="muted small">${esc(W.fa.split(":")[1] || W.fa)}</span></div>
      <div class="seg" role="group" aria-label="نسخه تمرین"><button data-act="mode" data-v="gym" aria-pressed="${!home}">${en("Gym")}</button><button data-act="mode" data-v="home" aria-pressed="${home}">${en("Home")}</button></div></div>
    <div class="prog" role="progressbar" aria-label="پیشرفت جلسه" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${(sp * 100).toFixed(1)}%"></i></div>
    <p class="small muted num">${fa(done)} از ${fa(total)} ست · روی هر ست بزن تا تایمر استراحت شروع شود</p>
    <details class="fold" data-d="wu" ${openD.has("wu") ? "open" : ""}><summary>گرم کردن ۸ تا ۱۰ دقیقه</summary><ul class="wu">${PROGRAM.warmup.map(w => `<li>${en(w[0])}<span class="en">${esc(w[1])}</span></li>`).join("")}</ul></details>
    ${rows}
    <button class="btn ${wd ? "" : "pri"} block tick" style="margin-top:14px" data-act="tog" data-k="workout" aria-pressed="${wd}">${wd ? "جلسه انجام شد" : "پایان جلسه"}</button>`;
  if (inf.mu) return `<section class="card fade"><details class="fold" style="border:0;margin:0" data-d="mu" ${openD.has("mu") ? "open" : ""}><summary>تمرین ${inf.letter} (سبک، فقط بعد از تست‌ها اگر تازه‌ای)</summary>${body}</details></section>`;
  return `<section class="card fade" aria-label="جلسه تمرین">${body}</section>`;
}

function walkDay(inf, dd) {
  const g = dd.done.gtg || 0;
  let pips = ""; for (let k = 1; k <= 5; k++) pips += `<button class="dot ${k <= g ? "on" : ""}" data-act="pip" data-k="gtg" data-n="${k}" data-max="5" aria-pressed="${k <= g}" aria-label="GTG ست ${fa(k)} از ۵">${fa(k)}</button>`;
  return `<section class="card fade"><div class="sess-title"><span class="en" lang="en">Walk + GTG</span><span class="muted small">روز پیاده‌روی</span></div>
    <p class="muted" style="margin-top:8px">پیاده‌روی ${inf.weekend ? "۹۰ تا ۱۲۰" : "۶۰ تا ۹۰"} دقیقه با سرعت مکالمه (Zone 2)، هدف ۱۲٬۰۰۰ قدم یا بیشتر.</p>
    <h3 style="margin-top:16px;font-size:.95rem">${en("Grease the Groove")}</h3>
    <p class="small muted">۵ ست ${en("Pull-up")} سبک (۴۰ تا ۵۰٪ حداکثر، الان ۲ تکرار)، فاصله حداقل ۶۰ دقیقه، هرگز سخت.</p>
    <div class="sets">${pips}</div></section>`;
}

function checklist(inf, dd) {
  const L = items(inf), groups = [[], [], []];
  L.forEach(it => groups[GROUP[it.k] ?? 2].push(it));
  return `<section class="card fade" aria-label="چک‌لیست"><div class="head"><h2>چک‌لیست</h2><span class="small muted num">${fa(Math.round(pct(sel) * 100))}٪</span></div>` +
    groups.map((g, gi) => g.length ? `<div class="grp"><h3>${GROUP_FA[gi]}</h3>` + g.map(it => {
      const v = dd.done[it.k], f = frac(it, dd, inf);
      if (it.t === "b") return `<button class="chk tick" data-act="tog" data-k="${it.k}" aria-pressed="${!!v}"><span class="box">${ICON.check}</span><span class="lbl">${it.l}</span></button>`;
      if (it.t === "c") {
        let p = ""; for (let k = 1; k <= it.max; k++) p += `<button class="pip ${k <= (v || 0) ? "on" : ""}" data-act="pip" data-k="${it.k}" data-n="${k}" data-max="${it.max}" aria-pressed="${k <= (v || 0)}" aria-label="${fa(k)} از ${fa(it.max)}">${fa(k)}</button>`;
        return `<div class="row"><span class="lbl" id="l-${it.k}">${it.l}</span><div class="pips" role="group" aria-labelledby="l-${it.k}">${p}</div></div>`;
      }
      return `<div class="row"><span class="lbl">${it.l}</span><span class="num small" style="${f >= 1 ? "color:var(--ok);font-weight:700" : "color:var(--ink2)"}">${fa(Math.round(f * 100))}٪</span></div>`;
    }).join("") + `</div>` : "").join("") + `</section>`;
}

function waterCard(inf, dd) {
  const t = waterTarget(inf), ml = dd.water || 0, p = clamp(ml / t, 0, 1);
  return `<section class="card fade" aria-label="آب"><div class="water"><div class="tank" role="progressbar" aria-label="آب" aria-valuemin="0" aria-valuemax="${t}" aria-valuenow="${Math.min(ml, t)}"><i style="height:${(p * 100).toFixed(1)}%"></i></div>
    <div><h2>آب</h2><p><span class="big num">${fa(String(Number((ml / 1000).toFixed(2))))}</span> <span class="muted">از ${fa(t / 1000)} لیتر</span></p>
    <p class="small muted">${fa(Math.floor(ml / 250))} لیوان ۲۵۰ میلی‌لیتری. صبح ۵۰۰ میلی‌لیتر.</p>
    <div class="wbtns"><button class="btn pri" data-act="water" data-v="250">+۲۵۰</button><button class="btn pri" data-act="water" data-v="500">+۵۰۰</button><button class="btn" data-act="water" data-v="-250" ${ml <= 0 ? "disabled" : ""} aria-label="کم کردن ۲۵۰">−۲۵۰</button></div></div></div></section>`;
}

function fuel(inf) {
  const n = PROGRAM.nutrition[inf.type], kp = n.p * 4, kf = n.f * 9, kc = n.c * 4, tot = kp + kf + kc;
  return `<section class="card fade" aria-label="تغذیه"><div class="head"><h2>سوخت امروز</h2><span class="small muted">پنجره ۱۲:۰۰ تا ۲۰:۰۰</span></div>
    <div class="macro num"><div><b>${fa(n.kcal)}</b><span>کیلوکالری</span></div><div><b>${fa(n.p)}</b><span>پروتئین g</span></div><div><b>${fa(n.f)}</b><span>چربی g</span></div><div><b>${fa(n.c)}</b><span>کربو g</span></div></div>
    <div class="ratio" aria-hidden="true"><i style="width:${kp / tot * 100}%;background:var(--accent)"></i><i style="width:${kf / tot * 100}%;background:var(--gold)"></i><i style="width:${kc / tot * 100}%;background:var(--ink3)"></i></div>

/* ---------- stats ---------- */
let chartPts = [];
function weightChart(cur) {
  const W = 640, H = 280, L = 46, R = 14, T = 16, B = 36;
  const pts = []; for (let i = 0; i < 56; i++) { const w = weightOn(dateOf(i)); if (w) pts.push({ i, w, a: avg7(i) }); }
  chartPts = [];
  if (!pts.length) return `<div class="empty">وزن صبح را در «ثبت روز» وارد کن تا نمودار ساخته شود.</div>`;
  const all = pts.map(p => p.w).concat([TARGET_W, START_W]);
  const lo = Math.floor(Math.min(...all) - 0.5), hi = Math.ceil(Math.max(...all) + 0.5);
  const X = i => W - R - i / 55 * (W - L - R), Y = w => T + (hi - w) / (hi - lo) * (H - T - B);
  chartPts = pts.map(p => ({ ...p, x: X(p.i) }));
  let s = `<svg class="chart" id="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="روند وزن، آخرین میانگین ۷ روزه ${faN(pts[pts.length - 1].a, 1)} کیلوگرم"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  const step = hi - lo > 8 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 6}" text-anchor="end">${fa(v)}</text>`;
  for (let w = 0; w < 8; w++) s += `<text x="${X(w * 7 + 3)}" y="${H - 10}" text-anchor="middle">${fa(w + 1)}</text>`;
  s += `<line x1="${X(0)}" y1="${Y(START_W)}" x2="${X(55)}" y2="${Y(TARGET_W)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 6"/>`;
  if (pts.length > 1) {
    const line = pts.map(p => `${X(p.i).toFixed(1)},${Y(p.a).toFixed(1)}`).join(" ");
    s += `<polygon points="${X(pts[0].i).toFixed(1)},${H - B} ${line} ${X(pts[pts.length - 1].i).toFixed(1)},${H - B}" fill="url(#ga)"/>`;
    s += `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach(p => { s += `<circle cx="${X(p.i)}" cy="${Y(p.w)}" r="3.5" fill="var(--ink3)"/>`; });
  const last = pts[pts.length - 1];
  s += `<circle cx="${X(last.i)}" cy="${Y(last.a)}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>`;
  s += `<line id="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink3)" stroke-width="1" visibility="hidden"/>`;
  if (cur >= 0 && cur <= 55) s += `<line x1="${X(cur)}" x2="${X(cur)}" y1="${T}" y2="${H - B}" stroke="var(--gold)" stroke-width="1.5" opacity=".6"/>`;
  return `<div class="chartwrap">${s}</svg><div class="tip" id="tip" hidden></div></div>`;
}
function cmpBars(row) {

  return `<div><h3>${en(row[1])}</h3><div class="bars" role="img" aria-label="${esc(row[1])}: ${PH.map((p, k) => p[1] + " " + (v[k] || "-")).join("، ")}">` +

}
function prList(ex, lib, label) {
  const best = {};

      const r = +st.reps, kg = +st.kg, bw = BWLIFTS.includes(lib), k0 = (st.kg === "" || st.kg == null) ? (bw ? 0 : null) : kg;

    rows.map(r => `<tr><td class="num">${fa(r)}</td><td class="num">${fa(best[r].kg)}</td><td class="num small">${esc(fmtJ.format(parseISO(best[r].date)))}</td></tr>`).join("") + `</tbody></table>`

function viewStats() {
  const cur = clamp(todayIdx(), 0, 55), elapsed = todayIdx() < 0 ? 0 : cur + 1;
  const ps = []; for (let i = 0; i < elapsed; i++) ps.push(pct(i));
  const overall = elapsed ? mean(ps) : 0;
  const w0 = weightOn(S.start) ?? (avg7(Math.min(6, cur)) ?? null), wNow = avg7(cur);
  const wk = Math.floor(cur / 7) + 1, rates = weeklyRates(cur % 7 === 6 ? wk : wk - 1);
  const ch = wNow && w0 ? wNow - w0 : null;
  let h = `<div class="kpis num fade">
    <div class="kpi"><b>${fa(Math.round(overall * 100))}٪</b><span>تکمیل کل</span></div>
    <div class="kpi"><b>${fa(streak(todayIdx()))}</b><span>روز پیاپی با ۷۰٪ یا بیشتر</span></div>

  const done = rates.filter(r => r.rate != null);
  const last2 = rates.slice(-2), slow = last2.length === 2 && last2.every(r => r.rate != null && r.rate < 0.4);
  const fast = rates.length && rates[rates.length - 1].rate != null && rates[rates.length - 1].rate > 1.2, drops = strengthDrops();

    (done.length ? `<div class="rates">${done.map(r => { const c = r.rate < 0.4 ? "slow" : r.rate > 1.2 ? "fast" : "ok"; return `<div class="rate ${c}"><b class="num">${faN(r.rate, 2)}</b><span>هفته ${fa(r.w)} · ${c === "ok" ? "در باند" : c === "slow" ? "کند" : "سریع"}</span></div>`; }).join("")}</div>`

    (fast ? `<div class="rule warn"><b>تعدیل:</b> بیشتر از ۱٫۲ kg در هفته. ۱۵۰ کیلوکالری اضافه کن.</div>` : "") +
    (drops.length ? `<div class="rule bad"><b>تعدیل:</b> افت قدرت در ۲ جلسه پیاپی (${drops.map(x => en(x.toUpperCase())).join("، ")}). ۱۵۰ کیلوکالری اضافه کن.</div>` : "") +

  try {
    if (actx) {
      const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5);
      o.start(); o.stop(actx.currentTime + 0.55);
    }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
}
function startTimer(sec, label) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
  TM.end = Date.now() + sec * 1000; TM.total = sec; TM.label = label; clearInterval(TM.id); TM.id = setInterval(tickTimer, 250); tickTimer();
}
function stopTimer() { clearInterval(TM.id); clearTimeout(TM.hide); TM.end = 0; const el = $("#timer"); el.hidden = true; el.classList.remove("ding"); }
function tickTimer() {
  const el = $("#timer"); if (!TM.end) return;
  const left = Math.max(0, Math.ceil((TM.end - Date.now()) / 1000)), mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
  el.hidden = false;
  if (left <= 0) {
    clearInterval(TM.id); TM.end = 0; el.classList.add("ding"); beep();
    el.innerHTML = `<div class="in"><span class="t num">${fa("0:00")}</span><span class="lb">وقت ست بعدی · ${esc(TM.label)}</span><button data-act="tstop">باشه</button></div>`;
    TM.hide = setTimeout(stopTimer, 8000); return;
  }
  el.classList.remove("ding");
  el.innerHTML = `<div class="in"><span class="t num">${fa(mm + ":" + ss)}</span><span class="lb">استراحت · ${esc(TM.label)}</span><button data-act="tadd">+۳۰</button><button data-act="tstop">رد کن</button><span class="bar" style="width:${(left / TM.total * 100).toFixed(1)}%"></span></div>`;
}

/* ---------- log sheet ---------- */
let sheetRows = null, sheetEx = null;
function openSheet(exId, lib) {
  const inf = info(sel), d = D(inf.date), W = PROGRAM.workouts[inf.letter], ex = W.ex.find(e => e.id === exId);
  const n = Math.max(1, setsOf(doseOf(ex, inf.week, S.prefs.mode === "home")));
  let rows = (d.lifts[exId] || []).filter(s => (s.ex || "") === lib).map(s => ({ kg: s.kg, reps: s.reps }));
  if (!rows.length) {
    let prev = null;
    for (let i = sel - 1; i >= 0 && !prev; i--) { const p = peek(dateOf(i)); const L = p && p.lifts && p.lifts[exId]; if (L && L.length) { const m = L.filter(s => (s.ex || "") === lib); if (m.length) prev = m; } }
    rows = Array.from({ length: n }, (_, k) => ({ kg: prev ? (prev[Math.min(k, prev.length - 1)].kg ?? "") : "", reps: prev ? (prev[Math.min(k, prev.length - 1)].reps ?? "") : "" }));
  }
  sheetRows = rows; sheetEx = { exId, lib };
  drawSheet(); $("#sheet").showModal();
}
function drawSheet() {
  const lib = PROGRAM.lib[sheetEx.lib], bw = BWLIFTS.includes(sheetEx.lib);
  $("#sheet").innerHTML = `<div class="in"><div class="grab"></div><div class="head"><h2 id="sht" class="en" lang="en" style="font-size:1.3rem">${esc(lib.en)}</h2><button class="iconbtn" data-act="shclose" aria-label="بستن">✕</button></div>
    <p class="small muted" style="margin:-6px 0 6px">${bw ? "وزن بدن حساب است؛ فقط وزنه اضافه را بنویس (یا خالی)." : "وزنه کل و تکرار هر ست."} مقادیر از جلسه قبل پر شده‌اند.</p>
    <div class="lrow small muted" style="padding-top:0"><span>ست</span><span>${bw ? "kg اضافه" : "kg"}</span><span>تکرار</span></div>` +
    sheetRows.map((r, k) => `<div class="lrow"><span class="num faint">${fa(k + 1)}</span>
      <div class="step"><button data-act="st" data-k="${k}" data-f="kg" data-d="-2.5" aria-label="کم کردن وزنه ست ${fa(k + 1)}">−</button><input id="kg${k}" inputmode="decimal" aria-label="وزنه ست ${fa(k + 1)}" value="${esc(r.kg)}" data-act="sti" data-k="${k}" data-f="kg"><button data-act="st" data-k="${k}" data-f="kg" data-d="2.5" aria-label="افزودن وزنه ست ${fa(k + 1)}">+</button></div>
      <div class="step"><button data-act="st" data-k="${k}" data-f="reps" data-d="-1" aria-label="کم کردن تکرار ست ${fa(k + 1)}">−</button><input id="rp${k}" inputmode="numeric" aria-label="تکرار ست ${fa(k + 1)}" value="${esc(r.reps)}" data-act="sti" data-k="${k}" data-f="reps"><button data-act="st" data-k="${k}" data-f="reps" data-d="1" aria-label="افزودن تکرار ست ${fa(k + 1)}">+</button></div></div>`).join("") +
    `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" data-act="shadd">+ ست</button><button class="btn" data-act="shdel" ${sheetRows.length < 2 ? "disabled" : ""}>− ست</button><span style="flex:1"></span><button class="btn pri" data-act="shsave">ذخیره</button></div></div>`;
}

/* ---------- actions ---------- */
async function download(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iP(hone|ad|od)/.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"), u = URL.createObjectURL(new Blob([text], { type }));
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
const csvCell = c => { let t = String(c); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
function csv() {
  const keys = ["workout","walk","kcal","protein","water","salt","creatine","hang","sleep","gtg","checkin","tests","mu"];
  const rows = [["date","week","phase","day_type","workout_letter","completion_pct","weight_kg","steps","water_ml",...keys.map(k => "done_" + k),"note"]];
  for (let i = 0; i < 56; i++) {
    const inf = info(i), d = peek(inf.date) || { done: {} };
    rows.push([inf.date, inf.week, inf.phaseEn, inf.type, inf.letter || "", Math.round(pct(i) * 100), d.weight ?? "", d.steps ?? "", d.water ?? "",
      ...keys.map(k => d.done[k] === true ? 1 : (d.done[k] || "")), (d.note || "").replace(/\s+/g, " ")]);
  }
  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
function confirmDlg(title, body, yesLabel, onYes) {
  const dl = $("#dlg");
  dl.innerHTML = `<div class="in"><h2 id="dt">${title}</h2><p class="small muted" style="margin:8px 0 16px">${body}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="no">انصراف</button><button class="btn danger" id="yes">${yesLabel}</button></div></div>`;
  dl.showModal(); $("#no").focus();
  $("#no").onclick = () => dl.close();
  $("#yes").onclick = () => { dl.close(); onYes(); };
}
["#dlg", "#sheet"].forEach(s => $(s).addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); }));
function checkSessionDone(inf, d) {
  const W = PROGRAM.workouts[inf.letter]; if (!W) return;
  const home = S.prefs.mode === "home";
  const all = W.ex.every(ex => { const n = setsOf(doseOf(ex, inf.week, home)); return !n || (d.sets[ex.id] || 0) >= n; });
  if (all && !d.done.workout) { d.done.workout = true; stopTimer(); toast("همه ست‌ها انجام شد. جلسه ثبت شد."); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || ["INPUT", "SELECT", "TEXTAREA"].includes(b.tagName)) return;
  const a = b.dataset.act, inf = info(sel);
  switch (a) {
    case "tab": return go(b.dataset.v);
    case "prev": return setSel(sel - 1);
    case "next": return setSel(sel + 1);
    case "today": return setSel(todayIdx());
    case "open": sel = +b.dataset.i; if (tab !== "today") { tab = "today"; window.scrollTo(0, 0); } return render();
    case "mode": S.prefs.mode = b.dataset.v; save(); return render();
    case "tog": { const d = D(inf.date); d.done[b.dataset.k] = !d.done[b.dataset.k]; save(); return render(); }
    case "pip": { const d = D(inf.date), k = b.dataset.k, n = +b.dataset.n; d.done[k] = (d.done[k] || 0) === n ? n - 1 : n; save(); return render(); }
    case "set": {
      const d = D(inf.date), id = b.dataset.id, n = +b.dataset.n, max = +b.dataset.max, was = d.sets[id] || 0;
      d.sets[id] = was === n ? n - 1 : n;
      if (d.sets[id] > was && d.sets[id] < max) startTimer(+b.dataset.rest, b.getAttribute("aria-label").split(" ست ")[0] + " · ست " + fa(d.sets[id] + 1));
      checkSessionDone(inf, d); save(); return render();
    }
    case "tadd": TM.end += 30000; TM.total += 30; return tickTimer();
    case "tstop": return stopTimer();
    case "water": { const d = D(inf.date); d.water = Math.max(0, (d.water || 0) + +b.dataset.v); save(); return render(); }
    case "log": return openSheet(b.dataset.id, b.dataset.lib);
    case "shclose": return $("#sheet").close();
    case "st": { const r = sheetRows[+b.dataset.k], f = b.dataset.f, cur = parseNum(String(r[f] ?? ""), -1e9, 1e9) || 0; r[f] = Math.max(0, Math.round((cur + +b.dataset.d) * 100) / 100); const el = $(`#${f === "kg" ? "kg" : "rp"}${b.dataset.k}`); if (el) el.value = r[f]; return; }
    case "shadd": sheetRows.push({ ...(sheetRows[sheetRows.length - 1] || { kg: "", reps: "" }) }); return drawSheet();
    case "shdel": if (sheetRows.length > 1) sheetRows.pop(); return drawSheet();
    case "shsave": {
      const d = D(inf.date), keep = (d.lifts[sheetEx.exId] || []).filter(s => (s.ex || "") !== sheetEx.lib);
      const add = sheetRows.map(r => ({ kg: parseNum(String(r.kg ?? ""), 0, 500) ?? "", reps: parseNum(String(r.reps ?? ""), 0, 200) ?? "", ex: sheetEx.lib })).filter(r => r.reps !== "" && r.reps > 0);
      d.lifts[sheetEx.exId] = keep.concat(add); save(); $("#sheet").close(); toast(add.length ? `${fa(add.length)} ست ذخیره شد.` : "ستی با تکرار ثبت نشد."); return render();
    }
    case "pick": return $("#file").click();
    case "copy": {
      const txt = JSON.stringify(S);
      const fallback = () => { const ta = $("#copyout"); ta.value = txt; ta.classList.remove("vh"); ta.classList.add("inp"); ta.removeAttribute("aria-hidden"); ta.select(); toast("متن انتخاب شد؛ Copy بزن و در Notes ذخیره کن."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("پشتیبان کپی شد. در Notes ذخیره‌اش کن."), fallback); } catch (err) { fallback(); }
      return;
    }
    case "pasteimp": {
      let n = null; try { n = normalize(JSON.parse($("#pastebk").value)); } catch (err) {}
      if (!n) return toast("متن پشتیبان معتبر نیست.");
      return confirmDlg("داده‌های فعلی جایگزین شود؟", "پشتیبان چسبانده‌شده جایگزین همه داده‌های این مرورگر می‌شود.", "جایگزین کن", () => {
        S = n; save(); applyTheme(); sel = clamp(todayIdx(), 0, 55); render(); toast("پشتیبان وارد شد."); });
    }
    case "export": return download(`cut-backup-${todayISO()}.json`, JSON.stringify(S, null, 1), "application/json"), toast("فایل پشتیبان ساخته شد.");
    case "csv": return download(`cut-${todayISO()}.csv`, csv(), "text/csv");
    case "reset": return confirmDlg("همه داده‌ها پاک شود؟", "قبل از پاک کردن پشتیبان بگیر. این کار برگشت‌پذیر نیست.", "پاک کن", () => {
      S = dflt(); save(); sel = clamp(todayIdx(), 0, 55); applyTheme(); render(); });
  }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.act; if (!a) return;
  const inf = info(sel);
  if (a === "sti") { const v = parseNum(el.value, 0, 1000); if (v === undefined) { toast("عدد معتبر وارد کن."); el.value = sheetRows[+el.dataset.k][el.dataset.f]; return; } sheetRows[+el.dataset.k][el.dataset.f] = v ?? ""; el.value = v ?? ""; return; }
  if (a === "field") {
    const d = D(inf.date), f = el.dataset.f;
    if (f === "note") { d.note = el.value.slice(0, 2000); save(); return; }
    const val = parseNum(el.value, 0, f === "weight" ? 250 : 100000);
    if (val === undefined || (f === "weight" && val !== null && val < 30)) { toast("عدد معتبر وارد کن."); el.value = d[f] ?? ""; return; }
    d[f] = val; el.value = val ?? ""; save();
    if (f === "steps") { const h = $("#sthint"); if (h) h.innerHTML = val >= 12000 ? "امروز در چالش " + en("Step Streak") + " حساب می‌شود." : "حداقل ۱۲٬۰۰۰ قدم برای " + en("Step Streak") + "."; }
    return;
  }
  if (a === "test") {
    const val = parseNum(el.value, 0, 1000);
    if (val === undefined) { toast("عدد معتبر وارد کن."); return render(); }
    (S.tests[el.dataset.p] = S.tests[el.dataset.p] || {})[el.dataset.t] = val === null ? "" : val; el.value = val ?? ""; save();
    const c = $("#cmp"); if (c) c.innerHTML = TESTS.map(cmpBars).join("");
    return;
  }
  if (a === "theme") { S.prefs.theme = el.value; save(); applyTheme(); return render(); }
  if (a === "start") {
    if (!el.value) return;
    if (parseISO(el.value).getDay() !== 6) { toast("تاریخ شروع باید شنبه باشد."); el.value = S.start; return; }
    S.start = el.value; save(); sel = clamp(todayIdx(), 0, 55); return render();
  }
  if (a === "import") {
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let n = null; try { n = normalize(JSON.parse(r.result)); } catch (err) {}
      el.value = "";
      if (!n) return toast("فایل پشتیبان معتبر نیست.");
      confirmDlg("داده‌های فعلی جایگزین شود؟", "پشتیبان وارد شده جایگزین همه داده‌های این مرورگر می‌شود.", "جایگزین کن", () => {
        S = n; save(); applyTheme(); sel = clamp(todayIdx(), 0, 55); render(); toast("پشتیبان وارد شد."); });
    };
    r.readAsText(f);
  }
});
/* swipe between days */
let sx = null, sy = 0;
$("#view").addEventListener("touchstart", e => { if (tab !== "today" || e.touches.length !== 1 || e.target.closest(".tw,.chart,input,textarea,.week")) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("#view").addEventListener("touchend", e => {
  if (sx === null) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) setSel(sel + (dx > 0 ? 1 : -1));
}, { passive: true });
let lastISO = todayISO();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayISO() !== lastISO) { lastISO = todayISO(); sel = clamp(todayIdx(), 0, 55); render(); } if (!document.hidden && TM.end) tickTimer(); });
window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { S = load(); render(); } });
applyTheme();
render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
